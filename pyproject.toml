[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photonguard"
version = "0.1.0"
description = "A photon-counting physical baseline for PhotonGuard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
plots = ["matplotlib>=3.7,<4"]
test = ["pytest>=8,<10"]
gui = ["PySide6-Essentials>=6.8,<7", "matplotlib>=3.7,<4"]

[project.gui-scripts]
photonguard = "photonguard.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
